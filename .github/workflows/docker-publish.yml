# Baut das Docker-Image auf GitHub-Servern und veröffentlicht es in der GitHub
# Container Registry (ghcr.io/<besitzer>/<repository>, kleingeschrieben).
#
#   git tag v1.2.3 && git push origin v1.2.3   ->  :v1.2.3, :v1.2, :v1, :latest
#   Push auf main                               ->  :edge (Vorabversion zum Testen)
#
# Gebaut wird je Plattform auf einem eigenen, nativen Runner (amd64 und arm64,
# keine Emulation); ein abschließender Job fasst beide zu einem Image zusammen.
name: Docker-Image veröffentlichen

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io
  # Unterordner in runner.temp (upload-artifact erlaubt kein ".." im Pfad)
  DIGEST_SUBDIR: digests
  DIGEST_ARTIFACT_PREFIX: digests-

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Namen vorbereiten
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Metadaten (Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und nach Digest hochladen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Keine Images mit bekannten Sicherheitslücken veröffentlichen.
          build-args: |
            FAIL_ON_AUDIT=true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Digest merken
        run: |
          digest_dir="${RUNNER_TEMP}/${DIGEST_SUBDIR}"
          mkdir -p "$digest_dir"
          digest='${{ steps.build.outputs.digest }}'
          touch "$digest_dir/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIGEST_ARTIFACT_PREFIX }}${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/${{ env.DIGEST_SUBDIR }}/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Image zusammenfassen und taggen
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Namen vorbereiten
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/${{ env.DIGEST_SUBDIR }}
          pattern: ${{ env.DIGEST_ARTIFACT_PREFIX }}*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Metadaten (Tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=edge,branch=main
          flavor: |
            latest=auto

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image anlegen
        working-directory: ${{ runner.temp }}/${{ env.DIGEST_SUBDIR }}
        run: |
          args=()
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Ergebnis anzeigen
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
