# Hausverwaltung mit Docker Compose – Anleitung: docker/README.md
#
# Betrieb mit dem fertigen Image aus der GitHub Container Registry, in einem eigenen
# Verzeichnis neben dieser Datei:
#
#   curl -fsSL -o .env https://raw.githubusercontent.com/TheAkki/Hausverwaltung/main/.env.docker.example
#   # .env bearbeiten (mindestens ADMIN_EMAIL)
#   docker compose up -d
#
# Die Datei .env wird doppelt genutzt:
#   - Compose liest daraus Port, Image-Version und Profil (APP_PORT, HV_VERSION,
#     COMPOSE_PROFILES) sowie die Zugangsdaten für einen mitgelieferten
#     Datenbank-Container.
#   - Der App-Container bekommt alle Einträge als Umgebungsvariablen (env_file).
#     Weitere Laravel-Einstellungen können dort ohne Änderung dieser Datei ergänzt
#     werden.
#
# Aus dem geklonten Repository selbst bauen (dort ist .env die Entwicklungsdatei,
# deshalb .env.docker):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env.docker up -d --build
#
# Datenbank (DB_CONNECTION in .env):
#   sqlite            – ohne weiteren Dienst, Datei im storage-Volume (Standard)
#   mysql / mariadb   – mit COMPOSE_PROFILES=mariadb startet ein MariaDB-Container,
#                       sonst DB_HOST auf einen vorhandenen Server setzen
#   pgsql             – mit COMPOSE_PROFILES=postgres startet ein PostgreSQL-Container,
#                       sonst DB_HOST auf einen vorhandenen Server setzen
services:
  app:
    image: ${HV_IMAGE:-ghcr.io/theakki/hausverwaltung}:${HV_VERSION:-latest}
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: true
    # Feste Werte für den Docker-Betrieb; sie haben Vorrang vor der .env.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-}
      MARIADB_USER: ${DB_USERNAME:-}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      # Die Anwendung braucht kein Root-Konto; MariaDB vergibt ein zufälliges
      # Passwort, das nirgends gespeichert werden muss.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      # Name wie in früheren Versionen, damit vorhandene Daten erhalten bleiben.
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-}
      POSTGRES_USER: ${DB_USERNAME:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  db-data:
  postgres-data:
