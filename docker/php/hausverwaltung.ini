; Ergänzungen zu php.ini-production für die Hausverwaltung.

; PHP-Version nicht im Header "X-Powered-By" verraten.
expose_php = Off

; Uploads: Belege und Mietvertragsdokumente bis 10 MB, Backup-ZIPs größer.
; Muss zu client_max_body_size in docker/nginx/default.conf passen.
upload_max_filesize = 20M
post_max_size = 21M

; mPDF braucht für mehrseitige Abrechnungen mit Kopfbild mehr Speicher.
memory_limit = 256M

; Der Code im Image ändert sich nicht – Dateien nicht bei jedem Aufruf prüfen.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
