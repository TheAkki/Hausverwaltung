server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # nginx-Version nicht verraten.
    server_tokens off;

    # Muss zu upload_max_filesize/post_max_size in docker/php/hausverwaltung.ini passen.
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Nur der Front-Controller wird von PHP ausgeführt. Andere .php-Dateien –
    # etwa eine hochgeladene Datei unter /storage – werden nie interpretiert.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
